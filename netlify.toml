[build]
  command = "npm run build"
  # Netlify Next.js runtime manages publish output; kept for documentation.
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  # Netlify sets NODE_ENV=production which skips devDependencies, and the
  # runtime plugin below is a devDependency.
  NPM_FLAGS = "--include=dev"

# Next.js runtime adapter (OpenNext). Keep the repo-pinned version authoritative
# by removing any UI-installed plugin in the Netlify site settings.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Hashed build output can be cached forever; the media files never change name,
# so they get a long but not immutable cache.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/mash/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Advertise the AI-oriented index without requiring a crawl.
    Link = "</llms.txt>; rel=\"describedby\"; type=\"text/plain\""

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Vary = "Accept-Encoding"

# Blog responses carry cache tags so publishing a post can purge exactly the
# pages that changed instead of waiting out the CDN's TTL. The tag names are
# the ones in lib/netlify/purge-by-tags.ts; changing one side breaks purging
# silently, so keep them in step. These rules are inert while the blog is off.
[[headers]]
  for = "/blog"
  [headers.values]
    Netlify-Cache-Tag = "blog-index, blog-listings"

# Also covers the three feed routes under /blog/posts/.
[[headers]]
  for = "/blog/posts/*"
  [headers.values]
    Netlify-Cache-Tag = "blog-posts"

[[headers]]
  for = "/blog/category/*"
  [headers.values]
    Netlify-Cache-Tag = "blog-listings"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Netlify-Cache-Tag = "sitemap"
