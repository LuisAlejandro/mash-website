[bumpversion]
current_version = 1.4.1
commit = True
tag = True
tag_name = {new_version}

[bumpversion:file:package.json]
search = "version": "{current_version}"
replace = "version": "{new_version}"

[bumpversion:file:README.md]
search = Current version: {current_version}
replace = Current version: {new_version}

[maintainer-tools]
post_bump_commands = npm install --package-lock-only --ignore-scripts && node scripts/generate-agent-skills.mjs && node scripts/generate-mcp-card.mjs
